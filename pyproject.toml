[project]
name = "dupescan"
version = "0.1.0"
description = "Find and delete duplicate files in a directory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dupescan = "dupescan:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dupescan"]

[dependency-groups]
dev = ["pytest>=8.0"]
